name: Publish

# Artifact substrate: every main-merge publishes immutable sha-addressed
# artifacts; mirrorstack-infra deploys them by reference.
#
#   s3://mirrorstack-artifacts/dns-delegate-engine/<sha>/dns-delegate-api.zip
#   SSM  /mirrorstack/artifacts/dns-delegate-engine = <sha>  (pointer, written LAST)
#
# Auth: GitHub OIDC → AWS_PUBLISH_ROLE_ARN repo variable (a write-only role that
# trusts refs/heads/main of this repository only).

on:
  push:
    branches: [main]
  # 🔴 A PUBLISH THAT NEVER STARTED CANNOT BE ASKED FOR AGAIN WITHOUT THIS.
  #
  # `push` alone means a dropped push event leaves main carrying merged work
  # with no artifact — and since the core-pointer notify fires on a successful
  # Publish, no pointer PR either. Observed org-wide during the 2026-08-26
  # Actions outage.
  #
  # No inputs, deliberately: a sha input would invite publishing a commit that
  # is not main's head, which is how a stale artifact gets a fresh pointer.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # attestations: write is what lets actions/attest-build-provenance record a
  # signed provenance statement against this repository. Without it the step
  # fails at the API rather than silently skipping.
  attestations: write

# Serialize publishes so a slow run cannot interleave with the next merge — the
# SSM pointer must always name a fully-uploaded artifact set.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  ARTIFACT_BUCKET: mirrorstack-artifacts

jobs:
  publish:
    # Public repository: never the self-hosted fleet. See ci.yml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ap-northeast-1

      # 🔴 -X main.commit IS WHAT MAKES THE DEPLOYMENT AUDITABLE, AND THIS IS THE
      # ONLY PLACE IT IS SET.
      #
      # health() reports this sha, which is the step a reader takes from "I
      # audited this repository" to "this is the code answering me" — every other
      # property the repository claims is a fact about source until that step
      # exists. A build without the flag reports "unknown", which is honest and
      # useless; dropping the flag therefore breaks nothing loudly and quietly
      # makes docs/DESIGN.md §4 false. cmd/dns-delegate-api asserts this line.
      #
      # $GITHUB_SHA is the commit this workflow checked out, and so the commit
      # whose artifact the next steps upload under that same sha. Never a tag,
      # never a short sha, never a value from an input — the stamp and the
      # artifact path have to name the same thing or neither can be looked up.
      - name: Build service zips
        run: |
          mkdir -p dist
          for name in dns-delegate-api; do
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
              go build -tags lambda.norpc \
                -ldflags="-s -w -X main.commit=$GITHUB_SHA" \
                -o bootstrap "./cmd/$name"
            zip -j "dist/$name.zip" bootstrap
            rm bootstrap
          done

      # Lambda functions run on Graviton (arm64); the cross-compile above pins
      # GOARCH=arm64 regardless of runner arch. Assert it so a dropped GOARCH can
      # never publish a mismatched binary. Dependency-free arch check: the ELF
      # e_machine at offset 0x12 must be EM_AARCH64 (0xB7, little-endian).
      # Replaces file(1), whose apt install flaked on mirror connectivity and
      # failed a publish in a sibling repo.
      - name: Assert arm64 (aarch64) binaries
        run: |
          for name in dns-delegate-api; do
            unzip -p "dist/$name.zip" bootstrap > "$RUNNER_TEMP/$name-bootstrap"
            machine=$(od -An -tx1 -j18 -N2 "$RUNNER_TEMP/$name-bootstrap" | tr -d ' ')
            if [ "$machine" != "b700" ]; then
              echo "::error::$name bootstrap is not aarch64 (ELF e_machine=$machine)"
              exit 1
            fi
          done

      # 🔴 THE CLAIM "THE CODE YOU READ IS THE CODE WE RUN" WAS A PROMISE UNTIL
      # HERE. This repository is public so a customer can audit what may touch
      # their DNS — but what actually runs is a private artifact in a private
      # bucket, and nothing tied the two together. A reader could verify the
      # source and still not know it was the source that was deployed.
      #
      # attest-build-provenance signs a SLSA statement binding this zip's sha256
      # to this repository, this commit and this workflow, through Sigstore. It
      # is verifiable by anyone, against public infrastructure, with no access to
      # our AWS account:
      #
      #     gh attestation verify <artifact> --repo mirrorstack-ai/dns-delegate-engine
      #
      # BEFORE the upload, deliberately: attesting an artifact we then failed to
      # upload is harmless, while uploading one we failed to attest is the state
      # this step exists to prevent.
      #
      # 🔴 WHAT IT DOES NOT PROVE, and the honest limit to quote in a security
      # review: that the Lambda AWS runs IS this artifact. The service reports
      # its own build commit (see cmd/dns-delegate-api, `build`), and a
      # determined operator could ship a binary that lies about it. This moves
      # the attack from "unfalsifiable claim" to "someone deliberately built a
      # lying artifact", which is a different and much harder thing — not to
      # zero.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/dns-delegate-api.zip

      - name: Upload zips
        run: |
          for name in dns-delegate-api; do
            aws s3 cp "dist/$name.zip" \
              "s3://$ARTIFACT_BUCKET/dns-delegate-engine/$GITHUB_SHA/$name.zip"
          done

      # Latest pointer — must stay the LAST step, flipped only after every
      # artifact above landed. Consumers resolve this to a complete set.
      - name: Update latest pointer
        run: |
          aws ssm put-parameter \
            --name /mirrorstack/artifacts/dns-delegate-engine \
            --type String --overwrite \
            --value "$GITHUB_SHA"
